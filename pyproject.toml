[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "telephony-wer-bench"
version = "0.1.0"
description = "Streaming speech-to-text benchmark on 8 kHz telephony audio: WER, latency and partial stability."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Aqib Nawab", email = "aqibnawab1100@gmail.com" }]
keywords = ["speech-to-text", "asr", "wer", "telephony", "voice-ai", "benchmark", "streaming", "g711", "8khz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://telephony-wer-bench.vercel.app"
Documentation = "https://github.com/AQIB-NAWAB/telephony-wer-bench/tree/main/docs"
Repository = "https://github.com/AQIB-NAWAB/telephony-wer-bench"
Issues = "https://github.com/AQIB-NAWAB/telephony-wer-bench/issues"

[project.optional-dependencies]
vosk = ["vosk>=0.3.45"]
whisper = ["faster-whisper>=1.0"]
cloud = ["websockets>=12"]
images = ["pillow>=10"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pillow>=10",
    "websockets>=12",
]

[project.scripts]
twb = "twb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twb"]

[tool.hatch.build.targets.sdist]
include = ["src/twb", "tests", "docs", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["B905", "E501"]
