name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke test the CLI with the debug provider
        run: |
          twb prepare --conditions examples/conditions.yaml --out smoke/prepared --limit 3
          twb run smoke/prepared --provider oracle --no-pace --tail 0.1 --out smoke/run
          twb report smoke/run --out smoke/report
      - name: Upload sample report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke/report/
